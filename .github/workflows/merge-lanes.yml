name: Merge lanes

# Merges the real-machine lanes' pull requests (test/win-*, test/linux-*;
# test/arm-* until v0.101.3) once they keep to the rules in scripts/merge-lanes.py and
# their checks are green, with a merge commit pinned to the head. The merge
# routine (.claude/merge-routine.md) used to merge them, and the cloud
# session's auto mode refused the merge (2026-10-10, #309 / #310). A pull
# request that conflicts only in the checklists it merges itself (v0.86.9):
# main's file with the pull request's marks made again, checked to be marks
# only, pushed to main. Since v0.86.11 it also does the mechanical part of the
# merger's share (version, CHANGELOG) and pushes it to main, so a lane need not
# wait for the merge routine. Since v0.102.0 what a report leaves over becomes
# one finding issue, its votes are copied to the question issues as comments,
# and the pull request is labelled lane-review for the merge routine; every
# hour it also keeps the labels in step and counts the votes on question
# issues. Since v0.101.0 it labels a lane's status issue lane-stalled when the
# lane stops firing.
#
# It runs when a check workflow finishes (a lane's pull request turns green),
# every hour as a fallback, and by hand. It reads pull requests through the
# API and git and runs only main's copy of the script, never the pull
# request's code. Its pushes start no workflows, so it starts CI on main by
# workflow_dispatch after a share.

on:
  workflow_run:
    workflows: [CI, Checklists, Audit]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would be merged, merge nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: merge-lanes
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The whole history, and the token kept, so that a checklist
          # conflict can be merged locally and pushed to main.
          fetch-depth: 0
      - name: Self-test
        run: python3 scripts/merge-lanes.py --self-test
      - name: Merge what may be merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_LANES_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/merge-lanes.py
