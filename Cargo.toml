[package]
name = "kura"
version = "0.137.1"
edition = "2021"
rust-version = "1.95"
description = "A yazi-flavored, keyboard-driven file manager built with Rust + egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/kura"
readme = "README.md"
# Only for the Windows resource that carries the icon; see build.rs.
build = "build.rs"
# `kura-com` (src/bin/kura-com.rs, v0.71.0) made two binaries, and a bare
# `cargo run` stopped knowing which one to start.
default-run = "kura"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
crossbeam-channel = "0.5"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
open = { version = "5", features = ["shellexecute-on-windows"] }
trash = "5"
arboard = "3"
ignore = "0.4"
ab_glyph = "0.2"
ttf-parser = "0.25"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
sevenz-rust2 = "0.24"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The terminal pane (src/terminal.rs, src/ui/term.rs), shared with tsumugi
# since v0.78.125 and kept in uchmk/ito with the other shared crates since
# v0.93.10. Pinned to a commit, the same one for every ito crate; to take a
# fix, move `rev` and run `cargo build` so Cargo.lock follows. Pure Rust, like
# the rest.
ito-pane = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui", "wgpu"] }
# The border above the terminal pane, dragged to change its height (Q94).
# From the same commit as the pane; it depends on nothing but egui.
ito-layout = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui"] }
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# `kura mcp` (Q95, Q96): the per-user door into the running window (Unix
# socket / named pipe) and the MCP server Claude Code talks to over stdio.
# Hand-written on serde_json, no async runtime. The same commit as the pane.
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The rule a search query matches by (`f` `s` `S` `/` `?` `F`), shared with tsumugi; the same commit as the others.
ito-match = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The clock at the status bar's right end and the `[clock]` / `language` of the
# config shared by every uchmk app (common.toml); the same commit as the others.
ito-common = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["clock", "egui", "dirwatch"] }
# The bug report link and its form (F12): version/OS lines, the context text and the shared issue form; the same commit as the others.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The settings screen (Ctrl+,): the frame, side nav, search and the shared
# Language / CLOCK rows every uchmk app draws alike, and the palette it paints
# with. The same commit as the others; pure Rust on egui.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The bundled monospace face (JetBrains Mono) and common.toml's `mono_font` (v0.128.0); the same commit as the others.
ito-fonts = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# A toast from the OS when a long copy, move or delete ends behind another window (#345); the same commit as the others.
ito-notify = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", default-features = false }
# The key notation (parse, print, from egui, `display_seq`), shared with yagura; the same commit as the others.
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa", features = ["egui"] }
# keymap.toml: the layers folded over the defaults, resolved key by key, and the
# warnings for keys that can never run (moved out of here into ito 0.32.0); the same commit as the others.
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# Mouse selection and copy of the preview pane's painted text (v0.112.0); the same commit as the others.
ito-select = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# `kura.com` (src/bin/kura-com.rs) and the answers `say` writes (v0.114.0); the same commit as the others.
ito-console = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The keys help panel: rows, drawing, hit test and the text for `C` (v0.122.0); the same commit as the others.
ito-help = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# How an editor is told a line, and the `[line_args]` that overrides it (v0.123.0); the same commit as the others.
ito-openin = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
# The window's own title bar (drag, caption buttons, the palette box, the bell) and the list the bell opens (v0.131.0); the same commit as the others.
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
ito-notices = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "qoi"]

[dependencies.syntect]
version = "5"
default-features = false
features = ["default-fancy"]

# bat's syntax collection: TOML, TypeScript, Dockerfile and ~150 more
# languages that syntect's own bundle lacks.
[dependencies.two-face]
version = "0.5"
default-features = false
features = ["syntect-fancy"]

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false

[dev-dependencies]
# The checklists' generator behind examples/make-testcheck.rs and
# make-keycheck.rs (v0.103.0); the same commit as the ito crates above.
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }

[profile.dev]
opt-level = 1

# No debug info for the dependencies, only for kura itself: a backtrace still
# names kura's own lines, and the 500-odd crates underneath stop being most of
# `target` (a cloud session filled its disk twice on 2026-10-03).
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

# The host, not the target: compiling a Windows resource needs the SDK's rc.exe,
# so this is only pulled in where it can actually run.
[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "43e0841c7878c5a552fa206b043e3054233443aa" }
