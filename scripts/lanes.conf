# kura's values for the lanes' shared scripts (scripts/lanes.sh): the scripts
# are the same bytes in every uchmk app and read what differs from here.
#   app         the claims' state under .git (claim.sh), the finding marker
#   crate       whose version Cargo.lock carries (push-main.sh)
#   bin         the binary xrun.sh and keys.ps1 start
#   keys_env    the variable the app writes when `--keys` is done
#   state       the lanes' folder under %LOCALAPPDATA% (lane-boot.ps1); kura's
#               kept its name from when kura was filer
#   todo_marks  the marks that take a TODO.md item from the development
#               session (todo-open.sh), space-separated
app=kura
crate=kura
bin=kura
keys_env=KURA_KEYS_DONE
state=filer-wintest
todo_marks=【人】 【QA】 【実機】 【後】 【pane】 要確認
