# Row 41.15: the spot panel's scrollbar thumb.
#
# Keys, from the `spot-long` fixture folder:
#   <Size:900x500><Tab><Snap:top> <A-j> x22 <Snap:bottom> <Esc>j<Tab><Snap:short> <Esc><Quit>
#
# `long.docx` has more rows than the panel shows at this size. `short.bin` is
# binary, so it gets only the File section, which fits.
spec = 1
row = "41.15"
tier = 1
fixtures = "spot-long"
window = { size_pt = [900, 500], pixels_per_point = 1.5 }

[[point]]
id = "thumb-top"
snap = "top"
target = "spot.scroll.thumb"
relative_to = "spot.panel"
fail_looks_like = "つまみが無い、左に寄る、パネルの外に出る、上に居ない"
expect = { present = true, overlay = "spot", inside = true, right_gap_px = { min = 0, max = 2 }, width_px = { min = 1, max = 9 }, top_gap_px = { min = 0, max = 1 } }

[[point]]
id = "thumb-bottom"
snap = "bottom"
target = "spot.scroll.thumb"
relative_to = "spot.panel"
fail_looks_like = "つまみが下まで動いていない、パネルの外に出る"
expect = { present = true, overlay = "spot", inside = true, right_gap_px = { min = 0, max = 2 }, bottom_gap_px = { min = 0, max = 1 } }

[[point]]
id = "fits-file-is-open"
snap = "short"
target = "spot.panel"
fail_looks_like = "パネルが開いていない（つまみが無いのはそのせいになる）"
expect = { present = true, overlay = "spot" }

[[point]]
id = "no-thumb-when-fits"
snap = "short"
target = "spot.scroll.thumb"
fail_looks_like = "収まるパネルにつまみが出ている"
expect = { present = false }
