# Row 20.17a: inside a git repository the branch takes the outline hint's room.
#
# Keys, from the `status-crumb-git` fixture folder:
#   <Size:1280x800><A-j><A-j><A-j><A-j><A-j><A-j><State:g1280><Quit>
spec = 1
row = "20.17a"
tier = 1
fixtures = "status-crumb-git"
window = { size_pt = [1280, 800], pixels_per_point = 1.5 }

[[point]]
id = "hint-0"
state = "g1280"
target = "status.hint.0"
fail_looks_like = "`M source` が出ていない"
expect = { text = "M source" }

[[point]]
id = "hint-1-gone"
state = "g1280"
target = "status.hint.1"
fail_looks_like = "ブランチがあるのに `<BackTab> outline` が出ている"
expect = { present = false }

[[point]]
id = "branch"
state = "g1280"
target = "status.right"
fail_looks_like = "ブランチの名前が右の項目に出ていない"
expect = { text = { contains = "main" } }

[[point]]
id = "crumb"
state = "g1280"
target = "status.crumb"
relative_to = "app.root"
fail_looks_like = "長い見出しの先頭が出ていない、枠の終わりで切れていない（`…` がない）、または枠の幅が違う"
expect = { text = { contains = "A long" }, elided = true, width_px = { min = 163, max = 172 } }
