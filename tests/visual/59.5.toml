# Row 59.5, keyboard half: Ctrl+Shift+P opens the command palette.
#
# Keys, from any folder:
#   <Size:900x500><State:before><C-S-p><State:palette><Esc><Quit>
#
# The row also asks for a click on the title bar's palette box. That half needs
# the box's test id (uchmk/ito#209) and is not in this spec, so this spec alone
# does not settle the row.
spec = 1
row = "59.5"
tier = 1
fixtures = "any"
window = { size_pt = [900, 500], pixels_per_point = 1.5 }

[[point]]
id = "closed-before"
state = "before"
fail_looks_like = "パレットを開く前から何かのオーバーレイが開いている"
expect = { no_overlay = true }

[[point]]
id = "ctrl-shift-p-opens-commands"
state = "palette"
fail_looks_like = "Ctrl+Shift+P でコマンド パレットが開かない、別のピッカーが開く"
expect = { overlay = "pick", app_state = { pick_title = "Commands" } }
